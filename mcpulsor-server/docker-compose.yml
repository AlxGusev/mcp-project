name: mcpulsor-server-and-inspector

services:
  server-http:
    build:
      context: ..
      dockerfile: mcpulsor-server/Dockerfile
      target: http
      args:
        MODULE_DIR: mcpulsor-server
        #MAIN_CLASS: edu.borisov.mcpulsor.server.McpulsorServerApplication
    image: mcpulsor-server:http
    container_name: mcpulsor-server-http
    expose:
      - "8091"
    ports:
      - "8091:8091"

  inspector-http:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector-http
    depends_on:
      - server-http
    environment:
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: "http://localhost:6274"
    ports:
      - "6274:6274"                # Inspector UI (http)
      - "6277:6277"                # Inspector proxy (http)
    volumes:
      - inspector-data:/home/node/.mcp-inspector

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 60
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        sleep 2 &&
        ollama pull gemma3:4b-it-q4_K_M &&
        ollama pull PetrosStav/gemma3-tools:4b &&
        wait
      "
    restart: unless-stopped

volumes:
  inspector-data: